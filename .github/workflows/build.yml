name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # PS5 Payload SDK release used for the build (https://github.com/ps5-payload-dev/sdk/releases)
  SDK_VERSION: v0.44
  # Pin the SDK wrappers as well as the installed compiler and linker.
  LLVM_CONFIG: /usr/bin/llvm-config-19

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 lld-19 llvm-19-dev xxd unzip python3

      - name: Cache PS5 Payload SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/ps5-payload-sdk
          key: ps5-payload-sdk-${{ env.SDK_VERSION }}

      - name: Install PS5 Payload SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o sdk.zip "https://github.com/ps5-payload-dev/sdk/releases/download/${SDK_VERSION}/ps5-payload-sdk.zip"
          unzip -q sdk.zip -d "$HOME"

      - name: Verify the SDK uses LLVM 19
        run: |
          sdk_bin="$HOME/ps5-payload-sdk/bin"
          llvm_version=$("$sdk_bin/prospero-llvm-config" --version)
          [[ "$llvm_version" == 19.* ]]
          "$sdk_bin/prospero-clang" --version
          "$sdk_bin/ld.lld" --version

      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^#define VERSION "NeoEnabler \(.*\)"$/\1/p' src/manager.c)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match VERSION \"${version}\" in src/manager.c"
            exit 1
          fi

      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p build
          awk -v v="## ${GITHUB_REF_NAME#v}" '$0 == v {f = 1; next} /^## / {f = 0} f' CHANGELOG.md > build/release-notes.md
          if ! grep -q '[^[:space:]]' build/release-notes.md; then
            echo "::error::CHANGELOG.md has no \"## ${GITHUB_REF_NAME#v}\" section describing the release"
            exit 1
          fi

      - name: Test memory guards and controls (host only)
        run: |
          cc -O2 -Wall -Wextra -Werror tests/firmware_version_test.c -o /tmp/neo-firmware-version-test
          /tmp/neo-firmware-version-test
          cc -O2 -Wall -Wextra -Werror tests/budget_test.c -o /tmp/neo-budget-test
          /tmp/neo-budget-test
          cc -O2 -Wall -Wextra -Werror tests/budget_data_test.c -o /tmp/neo-budget-data-test
          /tmp/neo-budget-data-test
          cc -O2 -Wall -Wextra -Werror -Wno-unused-function tests/budget_mount_control_test.c -o /tmp/neo-budget-control-test
          /tmp/neo-budget-control-test
          bash tools/test_budget_shim.sh
          cc -O2 -Wall -Wextra -Werror -Ibuild/budget-shim-tests tests/budget_mount_hook_test.c -o /tmp/neo-budget-hook-test
          /tmp/neo-budget-hook-test

      - name: Test firmware diagnostic toolkit and Payload Manager source
        run: |
          python3 -m unittest discover -s tests -p 'test_firmware_report.py' -v
          python3 -m unittest discover -s tests -p 'test_payloads_json.py' -v

      - name: Test GPU policy, settings and HTTP forms (host only)
        run: |
          cc -O2 -Wall -Wextra -Werror tests/gpu_test.c -o /tmp/neo-gpu-test
          /tmp/neo-gpu-test
          cc -O2 -Wall -Wextra -Werror tests/http_test.c -o /tmp/neo-http-test
          /tmp/neo-http-test
          cc -O2 -Wall -Wextra -Werror tests/log_mirror_test.c -o /tmp/neo-log-mirror-test
          /tmp/neo-log-mirror-test

      - name: Test XML merge and patch sync (host only)
        run: |
          cc -O2 -Wall -Wextra -Werror tests/xml_merge_test.c -o /tmp/neo-xml-merge-test
          /tmp/neo-xml-merge-test
          cc -O2 -Wall -Wextra -Werror tests/game_patches_test.c -o /tmp/neo-game-patches-test
          /tmp/neo-game-patches-test
          cc -O2 -Wall -Wextra -Werror tests/patch_sync_test.c -o /tmp/neo-patch-sync-test
          /tmp/neo-patch-sync-test xml
          cc -O2 -Wall -Wextra -Werror tests/games_8gib_test.c -o /tmp/neo-games-8gib-test
          /tmp/neo-games-8gib-test xml
          cc -O2 -Wall -Wextra -Werror tests/attr_detect_test.c -o /tmp/neo-attr-detect-test
          /tmp/neo-attr-detect-test

      - name: Build
        # Panel behavior tests use the Node runtime supplied on the hosted runner.
        run: |
          node tests/panel_test.js
          node tests/panel_search_test.js
          node tests/panel_patches_test.js
          node tests/panel_games_test.js

      - name: Build payload
        run: PS5_PAYLOAD_SDK="$HOME/ps5-payload-sdk" bash build.sh

      - name: Checksum
        run: cd build && sha256sum neo-manager.elf > neo-manager.elf.sha256

      - name: Payload Manager source (payloads.json)
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 tools/payloads_json.py --repo "${GITHUB_REPOSITORY}" --date "$(date -u +%F)"

      - uses: actions/upload-artifact@v4
        with:
          name: neo-manager
          path: |
            build/neo-manager.elf
            build/neo-manager.elf.sha256
            build/release-notes.md
            build/payloads.json
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: neo-manager

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a suffix (v0.3.4-experimental) is published as a pre-release, so it never becomes "Latest".
          prerelease=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" neo-manager.elf neo-manager.elf.sha256 payloads.json "${prerelease[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "NeoEnabler ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md
